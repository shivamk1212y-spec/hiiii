<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Text - OpenAI Whisper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-block;
            margin: 0 auto;
        }

        .language-selector {
            text-align: center;
            margin: 20px 0;
        }

        .language-selector select {
            padding: 12px 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 16px;
            cursor: pointer;
            background: white;
            min-width: 200px;
        }

        .mic-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-button:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s infinite;
        }

        .mic-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
            color: #666;
            min-height: 30px;
        }

        .status.active {
            color: #f5576c;
            font-weight: bold;
        }

        .status.success {
            color: #48bb78;
            font-weight: bold;
        }

        .status.error {
            color: #f5576c;
        }

        .output-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            min-height: 150px;
            margin: 20px 0;
            border: 2px solid #e0e0e0;
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-box.empty {
            color: #999;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .copy-btn {
            background: #667eea;
            color: white;
        }

        .copy-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .clear-btn {
            background: #f5576c;
            color: white;
        }

        .clear-btn:hover:not(:disabled) {
            background: #e04556;
            transform: translateY(-2px);
        }

        .download-btn {
            background: #48bb78;
            color: white;
        }

        .download-btn:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
        }

        .notification.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .notification.error {
            background: #f5576c;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }

        .loader.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-banner {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        .recording-indicator.active {
            display: flex;
        }

        .recording-dot {
            width: 12px;
            height: 12px;
            background: #f5576c;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice to Text</h1>
        <p class="subtitle">
            <span class="badge">Powered by OpenAI Whisper</span>
        </p>

        <div class="info-banner">
            💡 <strong>Tip:</strong> Record clear audio for best results. Supports 99+ languages!
        </div>

        <div class="language-selector">
            <label for="languageSelect" style="display: block; margin-bottom: 8px; color: #555; font-weight: 600;">
                Select Language
            </label>
            <select id="languageSelect">
                <option value="hi">हिंदी (Hindi)</option>
                <option value="en">English</option>
                <option value="es">Español (Spanish)</option>
                <option value="fr">Français (French)</option>
                <option value="de">Deutsch (German)</option>
                <option value="ja">日本語 (Japanese)</option>
                <option value="ko">한국어 (Korean)</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="ru">Русский (Russian)</option>
            </select>
        </div>

        <div class="mic-container">
            <button class="mic-button" id="micButton">🎤</button>
        </div>

        <div class="recording-indicator" id="recordingIndicator">
            <span class="recording-dot"></span>
            <span id="recordingTime">00:00</span>
        </div>

        <div class="loader" id="loader"></div>

        <div class="status" id="status">Click microphone to start recording</div>

        <div class="output-box empty" id="output">Your transcribed text will appear here...</div>

        <div class="button-group">
            <button class="action-button copy-btn" id="copyBtn" disabled>📋 Copy</button>
            <button class="action-button download-btn" id="downloadBtn" disabled>💾 Download</button>
            <button class="action-button clear-btn" id="clearBtn">🗑️ Clear</button>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const micButton = document.getElementById('micButton');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const languageSelect = document.getElementById('languageSelect');
        const notification = document.getElementById('notification');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const recordingTime = document.getElementById('recordingTime');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let transcribedText = '';
        let recordingStartTime;
        let recordingTimer;

        // Check microphone permission
        micButton.addEventListener('click', async function() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await transcribeAudio(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordingStartTime = Date.now();
                
                micButton.classList.add('recording');
                recordingIndicator.classList.add('active');
                status.textContent = '🔴 Recording... Click again to stop';
                status.classList.add('active');
                
                // Start timer
                updateRecordingTime();
                recordingTimer = setInterval(updateRecordingTime, 1000);

            } catch (error) {
                console.error('Microphone error:', error);
                showNotification('❌ Microphone access denied! Please allow microphone access.', 'error');
                status.textContent = 'Microphone access denied';
                status.classList.add('error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micButton.classList.remove('recording');
                recordingIndicator.classList.remove('active');
                clearInterval(recordingTimer);
                status.textContent = '⏳ Processing audio...';
                status.classList.remove('active');
                loader.classList.add('active');
            }
        }

        function updateRecordingTime() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            recordingTime.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        async function transcribeAudio(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                formData.append('language', languageSelect.value);

                // Call backend API
                const response = await fetch('/api/transcribe', {
                    method: 'POST',
                    body: formData
                });

                loader.classList.remove('active');

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Transcription failed');
                }

                const data = await response.json();
                
                if (data.text) {
                    transcribedText = data.text;
                    output.textContent = transcribedText;
                    output.classList.remove('empty');
                    status.textContent = '✅ Transcription successful!';
                    status.classList.add('success');
                    status.classList.remove('error');
                    showNotification('✅ Transcription successful!');
                    
                    copyBtn.disabled = false;
                    downloadBtn.disabled = false;
                } else {
                    throw new Error('No text received');
                }

            } catch (error) {
                loader.classList.remove('active');
                console.error('Transcription error:', error);
                status.textContent = '❌ Error: ' + error.message;
                status.classList.add('error');
                status.classList.remove('success');
                showNotification('❌ ' + error.message, 'error');
            }
        }

        // Copy button
        copyBtn.addEventListener('click', function() {
            if (transcribedText) {
                navigator.clipboard.writeText(transcribedText).then(() => {
                    showNotification('📋 Text copied to clipboard!');
                }).catch(err => {
                    showNotification('❌ Failed to copy', 'error');
                });
            }
        });

        // Download button
        downloadBtn.addEventListener('click', function() {
            if (transcribedText) {
                const blob = new Blob([transcribedText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `transcript_${new Date().getTime()}.txt`;
                a.click();
                URL.revokeObjectURL(url);
                showNotification('💾 File downloaded!');
            }
        });

        // Clear button
        clearBtn.addEventListener('click', function() {
            transcribedText = '';
            output.textContent = 'Your transcribed text will appear here...';
            output.classList.add('empty');
            status.textContent = 'Click microphone to start recording';
            status.classList.remove('success', 'error', 'active');
            copyBtn.disabled = true;
            downloadBtn.disabled = true;
        });

        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = 'notification show';
            if (type === 'error') {
                notification.classList.add('error');
            }
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
